<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Items · Stockroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="glass sidebar">
      <div class="brand"><span class="logo"></span>Stockroom</div>
      <nav>
        <a href="index.html">Overview</a>
        <a href="items.html" class="active">Items</a>
      </nav>
    </aside>

    <main>
      <header class="page-head">
        <div>
          <h1>Items</h1>
          <p>Add, edit and remove what you keep in stock.</p>
        </div>
        <button class="btn primary" id="addBtn" type="button">Add item</button>
      </header>

      <section class="glass panel">
        <div class="toolbar">
          <input type="search" id="search" placeholder="Search by name or category" aria-label="Search items">
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Name</th><th>Category</th><th class="num">Quantity</th><th class="num">Price</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="itemsBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <dialog id="itemDialog" class="glass modal">
    <form id="itemForm" novalidate>
      <h2 id="dialogTitle">Add item</h2>
      <input type="hidden" name="id">
      <label>Name<input name="name" required maxlength="80"></label>
      <label>Category<input name="category" required maxlength="40" list="cats"></label>
      <datalist id="cats"><option>Accessories</option><option>Displays</option><option>Furniture</option></datalist>
      <div class="row">
        <label>Quantity<input name="quantity" type="number" min="0" step="1" required></label>
        <label>Price ($)<input name="price" type="number" min="0" step="0.01" required></label>
      </div>
      <p class="form-error" id="formError" role="alert"></p>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn primary">Save item</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="glass modal">
    <h2>Delete item?</h2>
    <p><strong id="confirmName"></strong> will be removed permanently.</p>
    <div class="modal-actions">
      <button type="button" class="btn" data-close>Keep item</button>
      <button type="button" class="btn danger" id="confirmDelete">Delete item</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="js/common.js"></script>
  <script src="js/items.js"></script>
</body>
</html>
